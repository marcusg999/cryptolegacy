name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Spec §11: "Dependency pinning and lockfile integrity enforced in CI — this is
# a supply-chain target."
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, crypto checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` fails if package.json and the lockfile disagree, which is the
      # lockfile-integrity requirement.
      - name: Install (lockfile enforced)
        run: npm ci

      - name: Every dependency is pinned to an exact version
        run: |
          node -e '
            const pkg = require("./package.json");
            const loose = Object.entries({ ...pkg.dependencies, ...pkg.devDependencies })
              .filter(([, v]) => /^[\^~]|\*|x|latest/.test(v));
            if (loose.length) {
              console.error("Unpinned dependencies — a supply-chain target must not float:");
              for (const [n, v] of loose) console.error(`  ${n}: ${v}`);
              process.exit(1);
            }
            console.log("All dependencies pinned exactly.");
          '

      - name: Wordlist digest and integrity
        run: npm run verify:wordlist

      - name: Crypto leak check
        run: npm run check:leaks

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Production dependencies must be clean. Dev-only advisories are reported
      # but do not fail the build, since they do not reach a user's browser.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (informational)
        run: npm audit || true

  database:
    name: RLS policy suite
    runs-on: ubuntu-latest

    # PostgreSQL runs on the RUNNER, not as a service container.
    #
    # pgTAP is a server-side extension: its control and SQL files must sit in
    # the PostgreSQL installation the server is running from. A service
    # container runs the stock `postgres:16` image, so apt-installing
    # postgresql-16-pgtap on the runner puts the files on the wrong machine and
    # `create extension pgtap` fails with "extension is not available" — which
    # is exactly how this first failed.
    #
    # The runner image already ships PostgreSQL 16 with a stopped `main`
    # cluster, so this needs one package and one start command, and it matches
    # the environment the suite is developed against.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Start PostgreSQL 16 with pgTAP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 postgresql-16-pgtap
          sudo pg_ctlcluster 16 main start
          sudo -u postgres psql -c "alter user postgres password 'postgres'"
          # Fail here, loudly, rather than inside the suite if the extension
          # did not land where the server can see it.
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
            -c "create extension if not exists pgtap" -c "select extversion from pg_extension where extname = 'pgtap'"

      - name: Apply migrations and run the pgTAP suite
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/test-db.sh

      # Real cryptographic output crossing a real database and coming back.
      # Neither the unit tests nor pgTAP exercise the bytea conversion, and a
      # fault there would corrupt ciphertext silently.
      - name: Crypto round trip through the database
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npm run test:roundtrip

  build:
    name: Production build gate
    runs-on: ubuntu-latest
    needs: [verify, database]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Spec §10. Without CRYPTO_REVIEW_ATTESTATION this step fails by design,
      # and that failure is the gate working rather than a broken pipeline.
      # Set the secret once the external review is recorded; see REVIEW_GATE.md.
      - name: Build
        env:
          CRYPTO_REVIEW_ATTESTATION: ${{ secrets.CRYPTO_REVIEW_ATTESTATION }}
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_APP_ORIGIN: https://placeholder.example
          NEXT_PUBLIC_WEBAUTHN_RP_ID: placeholder.example
        run: npm run build
