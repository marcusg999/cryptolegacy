name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Spec §11: "Dependency pinning and lockfile integrity enforced in CI — this is
# a supply-chain target."
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, crypto checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` fails if package.json and the lockfile disagree, which is the
      # lockfile-integrity requirement.
      - name: Install (lockfile enforced)
        run: npm ci

      - name: Every dependency is pinned to an exact version
        run: |
          node -e '
            const pkg = require("./package.json");
            const loose = Object.entries({ ...pkg.dependencies, ...pkg.devDependencies })
              .filter(([, v]) => /^[\^~]|\*|x|latest/.test(v));
            if (loose.length) {
              console.error("Unpinned dependencies — a supply-chain target must not float:");
              for (const [n, v] of loose) console.error(`  ${n}: ${v}`);
              process.exit(1);
            }
            console.log("All dependencies pinned exactly.");
          '

      - name: Wordlist digest and integrity
        run: npm run verify:wordlist

      - name: Crypto leak check
        run: npm run check:leaks

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Production dependencies must be clean. Dev-only advisories are reported
      # but do not fail the build, since they do not reach a user's browser.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (informational)
        run: npm audit || true

  database:
    name: RLS policy suite
    runs-on: ubuntu-latest

    # PostgreSQL runs on the RUNNER, not as a service container.
    #
    # pgTAP is a server-side extension: its control and SQL files must sit in
    # the PostgreSQL installation the server is running from. A service
    # container runs the stock `postgres:16` image, so apt-installing
    # postgresql-16-pgtap on the runner puts the files on the wrong machine and
    # `create extension pgtap` fails with "extension is not available" — which
    # is exactly how this first failed.
    #
    # The runner image already ships PostgreSQL 16 with a stopped `main`
    # cluster, so this needs one package and one start command, and it matches
    # the environment the suite is developed against.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Start PostgreSQL 16 with pgTAP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 postgresql-16-pgtap
          sudo pg_ctlcluster 16 main start
          sudo -u postgres psql -c "alter user postgres password 'postgres'"
          # Fail here, loudly, rather than inside the suite if the extension
          # did not land where the server can see it.
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
            -c "create extension if not exists pgtap" -c "select extversion from pg_extension where extname = 'pgtap'"

      - name: Apply migrations and run the pgTAP suite
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/test-db.sh

      # Real cryptographic output crossing a real database and coming back.
      # Neither the unit tests nor pgTAP exercise the bytea conversion, and a
      # fault there would corrupt ciphertext silently.
      - name: Crypto round trip through the database
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npm run test:roundtrip

  build:
    name: Build and review gate
    runs-on: ubuntu-latest
    needs: [verify, database]

    # The `secrets` context is not available in a step-level `if`, so presence
    # is mapped to a boolean here, at job level, where it is. The value itself
    # is not exposed to every step.
    env:
      HAS_ATTESTATION: ${{ secrets.CRYPTO_REVIEW_ATTESTATION != '' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Two separate properties, checked separately.
      #
      # Running `npm run build` here and letting it fail when no attestation is
      # configured would leave this check permanently red, which is the worst
      # possible signal: a genuine compilation regression would look identical
      # to the gate doing its job, and nobody would notice either.
      #
      # So: assert the gate actually refuses, then assert the app actually
      # compiles. Neither of these deploys anything — the artifact is discarded
      # with the runner. The gate that matters is the one in `npm run build`,
      # which Netlify runs on every deploy and which is NOT bypassed here.

      - name: The review gate refuses a build with no attestation
        if: env.HAS_ATTESTATION != 'true'
        env:
          CRYPTO_REVIEW_ATTESTATION: ''
        run: |
          if npm run gate --silent; then
            echo "::error::The review gate allowed a build with no attestation recorded."
            echo "scripts/check-review-gate.mjs must fail closed. See REVIEW_GATE.md and spec §10."
            exit 1
          fi
          echo "✓ The gate refuses a production build until a cryptographic review is recorded."

      - name: The review gate rejects a malformed attestation
        if: env.HAS_ATTESTATION != 'true'
        env:
          CRYPTO_REVIEW_ATTESTATION: 'not-a-real-attestation'
        run: |
          if npm run gate --silent; then
            echo "::error::The review gate accepted a malformed attestation."
            exit 1
          fi
          echo "✓ The gate rejects an attestation that is not <reviewer>|<date>|<commit>."

      # Compilation only. Deliberately `next build` and not `npm run build`, so
      # this step cannot be mistaken for, or turned into, a production build.
      - name: The application compiles
        if: env.HAS_ATTESTATION != 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_APP_ORIGIN: https://placeholder.example
          NEXT_PUBLIC_WEBAUTHN_RP_ID: placeholder.example
        run: npx next build

      # Once a review is on record, run the real gated build, exactly as a
      # deploy would.
      - name: Production build
        if: env.HAS_ATTESTATION == 'true'
        env:
          CRYPTO_REVIEW_ATTESTATION: ${{ secrets.CRYPTO_REVIEW_ATTESTATION }}
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_APP_ORIGIN: https://placeholder.example
          NEXT_PUBLIC_WEBAUTHN_RP_ID: placeholder.example
        run: npm run build
